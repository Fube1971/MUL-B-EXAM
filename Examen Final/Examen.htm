<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>MDN Games: Three.js demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script src="three.min.js"></script>  
    <script src="OrbitControls.js"></script>
    <script src="Funciones.js"></script>
    
    <script>

          var WIDTH = window.innerWidth;
          var HEIGHT = window.innerHeight;

          var renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(WIDTH, HEIGHT);
          renderer.setClearColor(0x000000, 1);
          document.body.appendChild(renderer.domElement);

          var scene = new THREE.Scene();

          var camera = new THREE.PerspectiveCamera(80, WIDTH / HEIGHT);
          camera.position.z = 35;
          camera.position.x = 10;
          camera.position.y = 2;

          camera.rotation.set(0, -0.5, 0);
          scene.add(camera);

          var controls = new THREE.OrbitControls(camera, renderer.domElement);

          const Altura = 6; // Altura polyedro
          const NumerodeLados = 5; // NUmero de lados
          const ApotemaInferior = 5; // Diemnsion apotema inferior
          const ApotemaSuperior = 2; // Dimension apotema superior
          const espaciado = ApotemaInferior/2.5; // Espaciado entre geometrias

          // Call createGeometryGrid function with desired parameters
          const geometryGrid = CreaGrupodeMesh(Altura, NumerodeLados, ApotemaInferior, ApotemaSuperior, espaciado);
          const geometryGrid2 = CreaGrupodeMesh(Altura, NumerodeLados, ApotemaInferior, ApotemaSuperior, espaciado);

          geometryGrid2.position.y = Altura + 5;

          // Adcionar grupos de mesh a la escena
          scene.add(geometryGrid);
          scene.add(geometryGrid2);


          // Add ambient light
          const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
          scene.add(ambientLight);

          // Add directional lights
          const light1 = new THREE.DirectionalLight(0xffffff, 0.5);
          light1.position.set(0, 0, 10);
          scene.add(light1);

          const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
          light2.position.set(1, -2, -4);
          scene.add(light2);

          // Render the scene
          function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
          }
          animate();

          const size = 150;
          const divisions = 160;
          const axesHelper = new THREE.AxesHelper(1000);
          scene.add(axesHelper);

          const gridHelper = new THREE.GridHelper(size, divisions);
          scene.add(gridHelper);


          render();



    </script>
  </body>
</html>
